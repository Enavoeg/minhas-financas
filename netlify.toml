[build]
  publish = "."

# O app e o arquivo de atualização nunca ficam presos em cache:
# assim cada nova versão chega no celular na próxima abertura.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
